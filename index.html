<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partite Toti ed Eddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#16202e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: una scheda per weekend, due righe (Toti pallavolo, Eddy calcio), scritte grandi per leggerle al volo */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --ink: #16202e;
  --muted: #5b6676;
  --line: #d9e0e8;
  --franz: #02843c;          /* verde Gaffeo */
  --franz-soft: #e3f3e9;
  --eddy: #c2410c;           /* calcio */
  --eddy-soft: #fbe9df;
  --now: #16202e;
  --now-ink: #ffffff;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131d; --surface: #161f2d; --ink: #eef2f6; --muted: #9eaabb; --line: #283447;
    --franz: #3cc277; --franz-soft: #13301f; --eddy: #f2804b; --eddy-soft: #3a1d10;
    --now: #eef2f6; --now-ink: #0d131d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131d; --surface: #161f2d; --ink: #eef2f6; --muted: #9eaabb; --line: #283447;
  --franz: #3cc277; --franz-soft: #13301f; --eddy: #f2804b; --eddy-soft: #3a1d10;
  --now: #eef2f6; --now-ink: #0d131d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 17px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font: 800 2rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; }
h1 .f { color: var(--franz); } h1 .e { color: var(--eddy); }
.sub { color: var(--muted); font-size: .95rem; margin-top: 4px; }

.week { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.week-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.week-h b { font: 800 1.35rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.week-h span { color: var(--muted); font-size: .9rem; }
.week.now .week-h { background: var(--now); color: var(--now-ink); border-color: var(--now); }
.week.now .week-h span { color: var(--now-ink); opacity: .75; }

.who { display: grid; grid-template-columns: 6px 1fr; }
.who + .who { border-top: 1px solid var(--line); }
.who::before { content: ""; }
.who.franz::before { background: var(--franz); }
.who.eddy::before { background: var(--eddy); }
.who-b { padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.name { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name b { font: 800 1.5rem/1 var(--f-display); text-transform: uppercase; }
.franz .name b { color: var(--franz); } .eddy .name b { color: var(--eddy); }
.name small { color: var(--muted); font-size: .85rem; }
.when { font-weight: 700; font-size: 1.15rem; }
.when .t { font: 800 1.35rem/1 var(--f-display); margin-left: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.place { font-size: .98rem; }
.place b { font-weight: 600; }
.vs { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; font: 700 .72rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; }
.tag svg { width: 13px; height: 13px; }
.franz .tag { background: var(--franz-soft); color: var(--franz); }
.eddy .tag { background: var(--eddy-soft); color: var(--eddy); }
.maps { justify-self: start; display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 10px 16px; border-radius: 12px; text-decoration: none; font: 700 1.05rem/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: #ffffff; }
.franz .maps { background: var(--franz); } .eddy .maps { background: var(--eddy); }
:root[data-theme="dark"] .maps, :root:not([data-theme="light"]) .maps { color: #ffffff; }
.maps svg { width: 18px; height: 18px; }
.maps:focus-visible, .more:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.none { font: 700 1.2rem/1.2 var(--f-display); text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.played { opacity: .55; }
.played .maps { display: none; }
.more { width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font: 600 1rem var(--f-body); padding: 12px; border-radius: 12px; cursor: pointer; }
.empty { background: var(--surface); border-radius: 18px; padding: 24px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="f">Toti</span> &amp; <span class="e">Eddy</span></h1>
    <div class="sub">Dove giocano ogni weekend</div>
  </header>
  <div id="weeks"><div class="empty">Carico le partite…</div></div>
  <button class="more" id="more" type="button" hidden>Mostra altri weekend</button>
  <footer>Pallavolo: calendario FIPAV Lombardia · Calcio: calendario LND Monza</footer>
</main>

<!-- Per l'anteprima i dati possono essere incorporati qui; sul sito vengono letti dai file -->
<script id="dati" type="application/json"></script>
<script>
(function () {
  const GIORNI = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const FINE_MIN = 150;
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const parse = s => { const [a, b] = s.split("T"); const [y, m, d] = a.split("-").map(Number); const [h, mi] = (b || "00:00").split(":").map(Number); return new Date(y, m - 1, d, h, mi); };
  const lunedi = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const chiave = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

  const icoPin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const icoHome = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>';
  const icoPlane = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 15.5v-2l-8-5V3.8a1.5 1.5 0 0 0-3 0v4.7l-8 5v2l8-2.5v5l-2 1.5V21l3.5-1 3.5 1v-1.5l-2-1.5v-5z"/></svg>';

  function normFranz(j) {
    return (j.partite || []).map(p => ({ d: parse(p.inizio), casa: p.in_casa, avv: p.avversario, campo: p.impianto, ind: p.indirizzo, q: p.cerca_maps || (p.impianto + ", " + p.indirizzo) }));
  }
  function normEddy(j) {
    return (j.partite || []).map(p => ({ d: parse(p.inizio), riposo: !!p.riposo, oraDubbia: !!p.ora_da_confermare, casa: !!p.casa, avv: p.avversario, campo: p.campo, ind: p.indirizzo, q: [p.campo, p.indirizzo].filter(Boolean).join(", ") }));
  }

  function riga(cls, nome, sport, p, eddyVuoto) {
    let body;
    if (!p || p.riposo) {
      body = '<div class="none">' + (p && p.riposo ? "Riposo · nessuna partita" : eddyVuoto ? "Calendario da inserire" : "Nessuna partita") + '</div>';
    } else {
      const giocata = p.d.getTime() + FINE_MIN * 60000 < Date.now();
      body = '<div class="' + (giocata ? 'played' : '') + '" style="display:grid;gap:6px">' +
        '<div class="when">' + GIORNI[p.d.getDay()] + ' ' + p.d.getDate() + ' ' + MESI[p.d.getMonth()] + '<span class="t">' + (p.oraDubbia ? 'orario da confermare' : 'ore ' + pad(p.d.getHours()) + ':' + pad(p.d.getMinutes())) + '</span>' + (giocata ? ' · giocata' : '') + '</div>' +
        '<div class="place"><b>' + esc(p.campo) + '</b>' + (p.ind ? '<br>' + esc(p.ind) : '') + '</div>' +
        '<div class="vs"><span class="tag">' + (p.casa ? icoHome + "Casa" : icoPlane + "Trasferta") + '</span>contro ' + esc(p.avv) + '</div>' +
        '<a class="maps" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.q) + '" target="_blank" rel="noopener">' + icoPin + 'Google Maps</a>' +
        '</div>';
    }
    return '<div class="who ' + cls + '"><span></span><div class="who-b"><div class="name"><b>' + nome + '</b><small>' + sport + '</small></div>' + body + '</div></div>';
  }

  let mostrate = 4;
  function render(franz, eddy) {
    const oggi = new Date();
    const lunOggi = lunedi(oggi).getTime();
    const settimane = new Map();
    const metti = (lista, chi) => lista.forEach(p => {
      const l = lunedi(p.d);
      if (l.getTime() < lunOggi) return;
      const k = chiave(l);
      if (!settimane.has(k)) settimane.set(k, { lun: l, franz: [], eddy: [] });
      settimane.get(k)[chi].push(p);
    });
    metti(franz.lista, "franz"); metti(eddy.lista, "eddy");
    const tutte = [...settimane.values()].sort((a, b) => a.lun - b.lun);
    const box = document.getElementById("weeks");
    if (!tutte.length) { box.innerHTML = '<div class="empty">Nessuna partita in programma.</div>'; return; }
    const eddyVuoto = !eddy.lista.length;

    box.style.display = "grid"; box.style.gap = "18px";
    box.innerHTML = tutte.slice(0, mostrate).map(w => {
      const sab = new Date(w.lun); sab.setDate(sab.getDate() + 5);
      const dom = new Date(w.lun); dom.setDate(dom.getDate() + 6);
      const diff = Math.round((w.lun.getTime() - lunOggi) / (7 * 86400000));
      const titolo = diff === 0 ? "Questo weekend" : diff === 1 ? "Prossimo weekend" : "Tra " + diff + " settimane";
      const date = sab.getMonth() === dom.getMonth() ? sab.getDate() + "–" + dom.getDate() + " " + MESI[dom.getMonth()] : sab.getDate() + " " + MESI[sab.getMonth()] + " – " + dom.getDate() + " " + MESI[dom.getMonth()];
      const righe = [];
      (w.franz.length ? w.franz : [null]).forEach(p => righe.push(riga("franz", franz.nome, franz.sport, p, false)));
      (w.eddy.length ? w.eddy : [null]).forEach(p => righe.push(riga("eddy", eddy.nome, eddy.sport, p, eddyVuoto)));
      return '<section class="week' + (diff === 0 ? ' now' : '') + '"><div class="week-h"><b>' + titolo + '</b><span>' + date + '</span></div>' + righe.join("") + '</section>';
    }).join("");
    const more = document.getElementById("more");
    more.hidden = tutte.length <= mostrate;
    more.onclick = () => { mostrate = tutte.length; render(franz, eddy); };
  }

  async function avvia() {
    const box = document.getElementById("weeks");
    const inline = document.getElementById("dati").textContent.trim();
    try {
      let fj, ej, fmeta;
      if (inline) {
        const d = JSON.parse(inline); fmeta = d.franzMeta; fj = d.franz; ej = d.eddy;
      } else {
        fmeta = await fetch("data/toti.json", { cache: "no-store" }).then(r => r.json());
        [fj, ej] = await Promise.all([
          fetch(fmeta.fonte + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()),
          fetch("data/eddy.json", { cache: "no-store" }).then(r => r.json())
        ]);
      }
      const franz = { nome: fmeta.nome, sport: fmeta.sport + " · " + fmeta.squadra, lista: normFranz(fj) };
      const eddy = { nome: ej.nome, sport: ej.sport + " · " + ej.squadra, lista: normEddy(ej) };
      render(franz, eddy);
      setInterval(() => render(franz, eddy), 300000);
    } catch (e) {
      box.innerHTML = '<div class="empty">Non riesco a leggere i calendari. Riprova tra poco.</div>';
    }
  }
  avvia();
})();
</script>
</body>
</html>
